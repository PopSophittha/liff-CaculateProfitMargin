<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<title>Price Calculator V1.0.8</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:sans-serif;
}
.card{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
h2{
    text-align:center;
    margin-top:0;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:22px;
    border:1px solid #ddd;
    border-radius:12px;
}
button{
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#06C755;
    color:white;
}
.result{
    margin-top:20px;
    display:none;
}
.price-main{
    font-size:42px;
    font-weight:bold;
    color:#06C755;
    text-align:center;
}
.suggest{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-top:10px;
}
.box{
    flex:1;
    background:#f7f7f7;
    border-radius:10px;
    text-align:center;
    padding:10px;
}
.best{
    background:#06C755;
    color:white;
    font-weight:bold;
}
.private-box{
    margin-top:10px;
    background:#FFF3CD;
    border-radius:10px;
    padding:12px;
    text-align:center;
}
.private-price{
    font-size:30px;
    font-weight:bold;
    color:#C28A00;
}
table{
    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}
td{
    padding:6px;
    border-bottom:1px solid #eee;
}
td:last-child{
    text-align:right;
    font-weight:bold;
}
small{
    font-size:12px;
}
</style>
</head>

<body>

<div class="card">

<h2>คำนวณราคาขาย</h2>

<input type="number" id="cost" placeholder="กรอกต้นทุนสินค้า">

<button onclick="calculate()">คำนวณราคา</button>

<div id="result" class="result"></div>

</div>

<script>
async function initLIFF(){
    try{
        await liff.init({
            liffId:"YOUR_LIFF_ID"
        });
    }catch(e){
        console.log(e);
    }
}

initLIFF();

function nextEndingPrice(start, ending) {
    let p = Math.ceil(start);

    while ((p % 10) !== ending) {
        p++;
    }

    return p;
}

function calcPrice(cost, marginPercent) {

    const operatingCost = cost * 0.15;
    const totalCost = cost + operatingCost;

    const margin = marginPercent / 100;

    // Margin สูงสุด 99%
    if (margin >= 1) {
        return null;
    }

    // สูตร Margin จริง
    const beforeVat = totalCost / (1 - margin);

    // กำไรจริง
    const profit = beforeVat - totalCost;

    // VAT 7%
    const vat = beforeVat * 0.07;

    // ราคาขายรวม VAT
    const finalPrice = beforeVat + vat;

    // ราคาพนักงานซื้อ
    const staffBuy = Math.round(totalCost);

    return {
        marginPercent,
        operatingCost,
        totalCost,
        staffBuy,
        profit,
        beforeVat,
        vat,
        finalPrice,
        sellPrice: nextEndingPrice(finalPrice, 5)
    };
}
    
function detailBlock(label, data) {
    return `
        <b>${label}</b><br>
        ราคาก่อน VAT : ${data.beforeVat.toFixed(2)} บาท<br>
        VAT 7% : ${data.vat.toFixed(2)} บาท<br>
        ราคาคำนวณ : ${data.finalPrice.toFixed(2)} บาท<br>
        ราคาขาย : ${data.sellPrice} บาท<br><br>
    `;
}

function calculate() {
    const cost = Number(document.getElementById('cost').value);

    if (!cost || cost <= 0) {
        alert('กรุณากรอกต้นทุนสินค้า');
        return;
    }


const p20 = calcPrice(cost, 20);
const p25 = calcPrice(cost, 25);
const p30 = calcPrice(cost, 30);
const p35 = calcPrice(cost, 35);
const p40 = calcPrice(cost, 40);
const p45 = calcPrice(cost, 45);
const p50 = calcPrice(cost, 50);
const p55 = calcPrice(cost, 55);
const p58 = calcPrice(cost, 58);
const p60 = calcPrice(cost, 60);
const p70 = calcPrice(cost, 70);

    document.getElementById('result').style.display = 'block';

    document.getElementById('result').innerHTML = `

        <div class="price-main">
            ${p30.sellPrice.toLocaleString()} บาท
        </div>

        <div style="text-align:center;font-size:18px;margin-bottom:15px;">
            ⭐ ราคาขายแนะนำ
        </div>

        <div class="suggest">
            <div class="box best">
                💊 0฿ - 299฿<br>
                ${p58.sellPrice}<br>
                <small>ยา สินค้าทั่วไป</small>
            </div>
        
            <div class="box">
                🌿 300฿ - 399฿<br>
                ${p45.sellPrice}<br>
                <small>สมุนไพร</small>
            </div>
        
            <div class="box">
                💄 400฿ - 499฿<br>
                ${p35.sellPrice}<br>
                <small>Beauty & Spa</small>
            </div>
        
            <div class="box private-box" style="margin-top:0;">
                👑 500฿ - 599฿<br>
                ${p30.sellPrice}<br>
                <small>Private Label</small>
            </div>
        </div>

        <table>
            <tr>
                <td>พนักงานซื้อ</td>
                <td>${p30.staffBuy} บาท</td>
            </tr>

            <tr>
                <td>ราคาลด</td>
                <td>${p10.sellPrice} - ${p20.sellPrice} บาท</td>
            </tr>

            <tr>
                <td>ช่วงราคาปกติ</td>
                <td>${p30.sellPrice} - ${p80.sellPrice} บาท</td>
            </tr>
        </table>

        <details style="margin-top:15px;background:#f7f7f7;padding:10px;border-radius:10px;">
            <summary>ดูรายละเอียดการคำนวณทั้งหมด</summary>

            <br>

            <table>
                <tr>
                    <td>ต้นทุนสินค้า</td>
                    <td>${cost.toFixed(2)} บาท</td>
                </tr>
    
                <tr>
                    <td>ค่าใช้จ่ายดำเนินงาน</td>
                    <td>${p30.operatingCost.toFixed(2)} บาท</td>
                </tr>
                
                <tr>
                    <td>ต้นทุนรวม</td>
                    <td>${p30.totalCost.toFixed(2)} บาท</td>
                </tr>
            </table>
        
            <br>

            ${detailBlock('🏷️ ราคาลด Margin 10%', p10)}
            ${detailBlock('Margin 20%', p20)}
            ${detailBlock('⭐ ราคาแนะนำ ยาทั่วไป Margin 30%', p30)}
            ${detailBlock('Margin 40%', p40)}
            ${detailBlock('Margin 50%', p50)}
            ${detailBlock('🌿 สมุนไพรไทย Margin 60%', p60)}
            ${detailBlock('Margin 70%', p70)}
            ${detailBlock('💄 Beauty & Spa Margin 80%', p80)}
            ${detailBlock('Margin 90%', p90)}
            ${detailBlock('Margin 95%', p95)}
            ${detailBlock('👑 Maximum Margin 99%', p99)}
            
        </details>
    `;
}
</script>

</body>
</html>
