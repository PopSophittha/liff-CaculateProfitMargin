<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<title>Price Calculator V0.0.1</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:sans-serif;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:22px;
    border:1px solid #ddd;
    border-radius:12px;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#06C755;

}

.result{
    margin-top:20px;
    display:none;
}

.price-main{
    font-size:42px;

    display:flex;
    gap:10px;

}

    flex:1;
    background:#f7f7f7;

    text-align:center;
    padding:10px;
}

    background:#06C755;
    color:white;
    font-weight:bold;
}

    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}

    padding:6px;
    border-bottom:1px solid #eee;
}

td:last-child{
    text-align:right;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h2>คำนวณราคาขาย</h2>

<input
    type="number"
    id="cost"
    placeholder="กรอกต้นทุนสินค้า">

<button onclick="calculate()">
คำนวณราคา
</button>

<div id="result" class="result"></div>

</div>

<script>

async function initLIFF(){
    try{
        await liff.init({
            liffId:"YOUR_LIFF_ID"
        });
    }catch(e){}
}

initLIFF();

function nextEndingPrice(start,endings){

    let p=Math.ceil(start);

    while(true){

        let last=p%10;

        if(endings.includes(last)){
            return p;
        }

        p++;
    }
}

function calculate(){

    const cost =
        Number(document.getElementById('cost').value);

    if(cost<=0){
        alert('กรุณากรอกต้นทุน');
        return;
    }

    const operatingCost =
        cost * 0.15;

    const totalCost =
        cost + operatingCost;

    const profit =
        totalCost * 0.40;

    const beforeVat =
        totalCost + profit;

    const vat =
        beforeVat * 0.07;

    const finalPrice =
        beforeVat + vat;

    const minimumPrice =
        Math.ceil(finalPrice);

    const price5 =
        nextEndingPrice(minimumPrice,[5]);

    const price9 =
        nextEndingPrice(minimumPrice,[9]);

    const price0 =
        nextEndingPrice(minimumPrice,[0]);

    document.getElementById('result').style.display='block';

    document.getElementById('result').innerHTML=`

        <div class="price-main">
            ${price9} บาท
        </div>

        <div style="text-align:center">
            ⭐ แนะนำที่สุด
        </div>

        <div class="suggest">

            <div class="box">
                ${price5}<br>
                ลงท้าย 5
            </div>

            <div class="box best">
                ${price9}<br>
                ลงท้าย 9
            </div>

            <div class="box">
                ${price0}<br>
                ลงท้าย 0
            </div>

        </div>

        <table>

            <tr>
                <td>ต้นทุนสินค้า</td>
                <td>${cost.toFixed(2)}</td>
            </tr>

            <tr>
                <td>ค่าใช้จ่ายดำเนินงาน (15%)</td>
                <td>${operatingCost.toFixed(2)}</td>
            </tr>

            <tr>
                <td>ต้นทุนรวม</td>
                <td>${totalCost.toFixed(2)}</td>
            </tr>

            <tr>
                <td>กำไร (40%)</td>
                <td>${profit.toFixed(2)}</td>
            </tr>

            <tr>
                <td>VAT (7%)</td>
                <td>${vat.toFixed(2)}</td>
            </tr>

            <tr>
                <td>ราคาขั้นต่ำ</td>
                <td>${minimumPrice}</td>
            </tr>

        </table>
    `;
}

</script>

</body>
</html>
