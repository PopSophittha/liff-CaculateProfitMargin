<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<title>Price Calculator V1.0.2</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:sans-serif;
}
.card{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
h2{
    text-align:center;
    margin-top:0;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:22px;
    border:1px solid #ddd;
    border-radius:12px;
}
button{
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#06C755;
    color:white;
}
.result{
    margin-top:20px;
    display:none;
}
.price-main{
    font-size:42px;
    font-weight:bold;
    color:#06C755;
    text-align:center;
}
.suggest{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-top:10px;
}
.box{
    flex:1;
    background:#f7f7f7;
    border-radius:10px;
    text-align:center;
    padding:10px;
}
.best{
    background:#06C755;
    color:white;
    font-weight:bold;
}
.private-box{
    margin-top:10px;
    background:#FFF3CD;
    border-radius:10px;
    padding:12px;
    text-align:center;
}
.private-price{
    font-size:30px;
    font-weight:bold;
    color:#C28A00;
}
table{
    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}
td{
    padding:6px;
    border-bottom:1px solid #eee;
}
td:last-child{
    text-align:right;
    font-weight:bold;
}
small{
    font-size:12px;
}
</style>
</head>

<body>

<div class="card">

<h2>คำนวณราคาขาย</h2>

<input type="number" id="cost" placeholder="กรอกต้นทุนสินค้า">

<button onclick="calculate()">คำนวณราคา</button>

<div id="result" class="result"></div>

</div>

<script>
async function initLIFF(){
    try{
        await liff.init({
            liffId:"YOUR_LIFF_ID"
        });
    }catch(e){
        console.log(e);
    }
}

initLIFF();

function nextEndingPrice(start, ending) {
    let p = Math.ceil(start);

    while ((p % 10) !== ending) {
        p++;
    }

    return p;
}

function calcPrice(cost, profitPercent) {
    const operatingCost = cost * 0.15;
    const totalCost = cost + operatingCost;
    const profit = totalCost * (profitPercent / 100);
    const beforeVat = totalCost + profit;
    const vat = beforeVat * 0.07;
    const finalPrice = beforeVat + vat;

    return {
        profitPercent,
        operatingCost,
        totalCost,
        profit,
        beforeVat,
        vat,
        finalPrice,
        sellPrice: nextEndingPrice(finalPrice, 5)
    };
}

function detailBlock(label, data) {
    return `
        <b>${label}</b><br>
        ราคาก่อน VAT : ${data.beforeVat.toFixed(2)} บาท<br>
        VAT 7% : ${data.vat.toFixed(2)} บาท<br>
        ราคาคำนวณ : ${data.finalPrice.toFixed(2)} บาท<br>
        ราคาขาย : ${data.sellPrice} บาท<br><br>
    `;
}

function calculate() {
    const cost = Number(document.getElementById('cost').value);

    if (!cost || cost <= 0) {
        alert('กรุณากรอกต้นทุนสินค้า');
        return;
    }

    const p10  = calcPrice(cost, 10);
    const p20  = calcPrice(cost, 20);
    const p30  = calcPrice(cost, 30);
    const p40  = calcPrice(cost, 40);
    const p50  = calcPrice(cost, 50);
    const p60  = calcPrice(cost, 60);
    const p70  = calcPrice(cost, 70);
    const p80  = calcPrice(cost, 80);
    const p90  = calcPrice(cost, 90);
    const p100 = calcPrice(cost, 100);
    const p110 = calcPrice(cost, 110);
    const p120 = calcPrice(cost, 120);
    const p130 = calcPrice(cost, 130);
    const p140 = calcPrice(cost, 140);
    const p150 = calcPrice(cost, 150);

    document.getElementById('result').style.display = 'block';

    document.getElementById('result').innerHTML = `

        <div class="price-main">
            ${p30.sellPrice.toLocaleString()} บาท
        </div>

        <div style="text-align:center;font-size:18px;margin-bottom:15px;">
            ⭐ ราคาขายแนะนำ
        </div>

        <div class="suggest">
            <div class="box best">
                💊<br>
                ${p30.sellPrice}<br>
                <small>ยา สินค้าทั่วไป</small>
            </div>
        
            <div class="box">
                🌿<br>
                ${p60.sellPrice}<br>
                <small>สมุนไพร</small>
            </div>
        
            <div class="box">
                💄<br>
                ${p80.sellPrice}<br>
                <small>Beauty & Spa</small>
            </div>
        
            <div class="box private-box" style="margin-top:0;">
                👑<br>
                ${p120.sellPrice}<br>
                <small>Private Label</small>
            </div>
        </div>

        <table>
            <tr>
                <td>พนักงานซื้อ</td>
                <td>${p30.totalCost} บาท</td>
            </tr>

            <tr>
                <td>ราคาลด</td>
                <td>${p10.sellPrice} - ${p20.sellPrice} บาท</td>
            </tr>

            <tr>
                <td>ช่วงราคาปกติ</td>
                <td>${p30.sellPrice} - ${p80.sellPrice} บาท</td>
            </tr>
        </table>

        <details style="margin-top:15px;background:#f7f7f7;padding:10px;border-radius:10px;">
            <summary>ดูรายละเอียดการคำนวณทั้งหมด</summary>

            <br>

            <table>
                <tr>
                    <td>ต้นทุนสินค้า</td>
                    <td>${cost.toFixed(2)} บาท</td>
                </tr>
    
                <tr>
                    <td>ค่าใช้จ่ายดำเนินงาน</td>
                    <td>${p30.operatingCost.toFixed(2)} บาท</td>
                </tr>
                
                <tr>
                    <td>ต้นทุนรวม</td>
                    <td>${p30.totalCost.toFixed(2)} บาท</td>
                </tr>
            </table>
        
            ${detailBlock('🏷️ ราคาลด กำไร 10%', p10)}
            ${detailBlock('กำไร 20%', p20)}
            ${detailBlock('⭐ ราคาแนะนำ ยาทั่วไป กำไร 30%', p30)}
            ${detailBlock('กำไร 40%', p40)}
            ${detailBlock('กำไร 50%', p50)}
            ${detailBlock('🌿 สมุนไพรไทย กำไร 60%', p60)}
            ${detailBlock('กำไร 70%', p70)}
            ${detailBlock('💄 Beauty & Spa กำไร 80%', p80)}
            ${detailBlock('กำไร 90%', p90)}
            ${detailBlock('กำไร 100%', p100)}
            ${detailBlock('กำไร 110%', p110)}
            ${detailBlock('👑 Private Label กำไร 120%', p120)}
            ${detailBlock('กำไร 130%', p130)}
            ${detailBlock('กำไร 140%', p140)}
            ${detailBlock('กำไร 150%', p150)}
        </details>
    `;
}
</script>

</body>
</html>
